# Fresheek Filters — Shopify app configuration
# Generated by Shopify CLI (shopify app init)

name = "Fresheek Filters"

client_id = "f330f6b76ad75ecedcf2c25345253d4b"
application_url = "https://shopify-filter.onrender.com"
embedded = true

[access_scopes]
# read_products: required to detect product types, vendors, and available filter data.
# write_themes: required by the Theme App Extension to render on the storefront theme.
scopes = "read_products,write_themes"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://shopify-filter.onrender.com/webhooks/customers/data_request"
  customer_deletion_url = "https://shopify-filter.onrender.com/webhooks/customers/redact"
  shop_deletion_url = "https://shopify-filter.onrender.com/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://shopify-filter.onrender.com/auth/callback",
  "https://shopify-filter.onrender.com/auth/shopify/callback",
  "https://shopify-filter.onrender.com/api/auth/callback"
]

[app_proxy]
url = "/api/config"
subpath = "fresheek-filters"
prefix = "apps"

[build]
