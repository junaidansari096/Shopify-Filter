# Fresheek Filters — Shopify app configuration
# Generated by Shopify CLI (shopify app init)

name = "Fresheek Filters"

client_id = "f330f6b76ad75ecedcf2c25345253d4b"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# read_products: required to detect product types, vendors, and available filter data.
# write_themes: required by the Theme App Extension to render on the storefront theme.
# read_shop_domains: required to resolve the shop domain during auth/session.
scopes = "read_products,write_themes,read_shop_domains"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://shopify.dev/apps/default-app-home/auth",
  "https://shopify.dev/apps/default-app-home/auth/callback",
]

[app_proxy]
url = "/api/config"
subpath = "fresheek-filters"
prefix = "apps"

[build]
include_config_on_deploy = true
